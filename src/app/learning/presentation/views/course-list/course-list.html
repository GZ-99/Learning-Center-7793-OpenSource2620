<h1 class="title">Courses</h1>
@if (store.loading()) { <mat-spinner/> }
@if (store.error()) { <mat-error>{{ store.error() }}</mat-error> }
<table mat-table [dataSource]="dataSource()" matSort>
  <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th><td mat-cell *matCellDef="let course">{{ course.id }}</td></ng-container>
  <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th><td mat-cell *matCellDef="let course">{{ course.title }}</td></ng-container>
  <ng-container matColumnDef="description"><th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th><td mat-cell *matCellDef="let course">{{ course.description }}</td></ng-container>
  <ng-container matColumnDef="category"><th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th><td mat-cell *matCellDef="let course">{{ course.category?.name ?? '-' }}</td></ng-container>
  <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let course"><button mat-icon-button aria-label="Edit course" (click)="editCourse(course.id)"><mat-icon>edit</mat-icon></button><button mat-icon-button aria-label="Delete course" (click)="deleteCourse(course.id)"><mat-icon>delete</mat-icon></button></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"/>
<button mat-raised-button (click)="navigateToNew()">New course</button>
