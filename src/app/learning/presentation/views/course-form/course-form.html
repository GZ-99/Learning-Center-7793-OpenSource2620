<h1 class="title">{{ isEdit ? 'Edit course' : 'New course' }}</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field><mat-label>Title</mat-label><input matInput formControlName="title">@if (form.controls.title.hasError('required')) { <mat-error>Title is required</mat-error> }</mat-form-field>
  <mat-form-field><mat-label>Description</mat-label><textarea matInput formControlName="description"></textarea>@if (form.controls.description.hasError('required')) { <mat-error>Description is required</mat-error> }</mat-form-field>
  <mat-form-field><mat-label>Category</mat-label><mat-select formControlName="categoryId">@for (category of categories(); track category.id) { <mat-option [value]="category.id">{{ category.name }}</mat-option> }</mat-select></mat-form-field>
  <button mat-raised-button type="submit" [disabled]="form.invalid">{{ isEdit ? 'Update' : 'Create' }}</button>
</form>
