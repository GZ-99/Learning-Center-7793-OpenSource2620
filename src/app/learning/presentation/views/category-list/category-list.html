<h1 class="title">Categories</h1>
@if (store.loading()) { <mat-spinner/> }
@if (store.error()) { <mat-error>{{ store.error() }}</mat-error> }
<table mat-table [dataSource]="dataSource()" matSort>
  <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th><td mat-cell *matCellDef="let category">{{ category.id }}</td></ng-container>
  <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th><td mat-cell *matCellDef="let category">{{ category.name }}</td></ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let category">
      <button mat-icon-button aria-label="Edit category" (click)="editCategory(category.id)">
        <mat-icon>edit</mat-icon></button>
      <button mat-icon-button aria-label="Delete category" (click)="deleteCategory(category.id)">
        <mat-icon>delete</mat-icon></button></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"/>
<button mat-raised-button (click)="navigateToNew()">New category</button>
